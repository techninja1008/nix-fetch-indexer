[package]
name = "nfi"
description = "Query CLI for the nix-fetch-indexer service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nfi"
path = "src/main.rs"

[dependencies]
nfi-api = { workspace = true, features = ["client"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tempfile.workspace = true
shell-words.workspace = true
toml = "0.8"

[dev-dependencies]
nfi-testenv = { path = "../nfi-testenv" }
nfi-interchange.workspace = true
reqwest.workspace = true
nfi-indexer = { path = "../nfi-indexer" }
