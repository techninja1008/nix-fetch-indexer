[package]
name = "nfi-auth"
description = "OIDC device code authentication and CEL authorisation shared by the nfi and yoink services and CLIs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
http = { workspace = true, optional = true }
cel = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[features]
# Token validation, claim extraction and CEL authorisation for services.
server = ["dep:reqwest", "dep:tokio", "dep:tracing", "dep:http", "dep:cel", "dep:jsonwebtoken"]
# Device code login, token refresh and the token cache for CLIs.
client = ["dep:reqwest", "dep:tokio"]
# An in-process mock OpenID provider for tests.
testing = ["server", "dep:axum"]

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
nfi-auth = { path = ".", features = ["server", "client", "testing"] }
axum.workspace = true
