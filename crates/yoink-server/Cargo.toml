[package]
name = "yoink-server"
description = "Core of the yoink mirroring service: HTTP API, auth, job tracking and the Mirror trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
yoink-api.workspace = true
nfi-auth = { workspace = true, features = ["server"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
axum.workspace = true

[dev-dependencies]
yoink-api = { workspace = true, features = ["client"] }
nfi-auth = { workspace = true, features = ["testing"] }
reqwest.workspace = true
