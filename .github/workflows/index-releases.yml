name: Index releases

# Index new NixOS releases and upload the bundles as GitHub release assets on
# the data repository. Nothing is ingested anywhere. Channels are discovered
# automatically (ci/channels.sh, policy in ci/config.json). See "Published
# indexes" in README.md for the layout.
#
# Requires the NFI_DATA_REPO_TOKEN secret: a fine-grained token with Contents
# read/write on the data repository (which needs at least one commit). Set the
# NFI_DATA_REPO variable to publish to a different repository.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Only this channel, e.g. nixos-26.05 (blank: all)"
        required: false
        default: ""
      max_releases:
        description: "Index at most this many new releases per channel (0: all)"
        required: false
        default: "0"
      backfill_datasets:
        description: "Instead of new releases, add these datasets to recorded releases lacking them (e.g. helpers-direct,helpers-full,eval-errors)"
        required: false
        default: ""

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.NFI_DATA_REPO_TOKEN }}
  NFI_STORE: gh:${{ vars.NFI_DATA_REPO || 'techninja1008/nix-fetch-indexer-data' }}
  NFI_INDEXER: ${{ github.workspace }}/bin/nfi-indexer
  NFI_BACKFILL_DATASETS: ${{ inputs.backfill_datasets }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: |
          cargo build --release --locked -p nfi-indexer
          mkdir -p bin && cp target/release/nfi-indexer bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfi-indexer
          path: bin/nfi-indexer
          retention-days: 1
      - name: Find channels with new releases
        id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::error::NFI_DATA_REPO_TOKEN secret is not set"
            exit 1
          fi
          echo "channels=$(ci/plan.sh "$CHANNEL")" >>"$GITHUB_OUTPUT"

  index:
    needs: plan
    if: needs.plan.outputs.channels != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    # One run per channel at a time: each run updates the channel's manifest
    # and cumulative bundles.
    concurrency:
      group: index-${{ matrix.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nfi-indexer
          path: bin
      # The helpers datasets instantiate probes against each release.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Index and upload
        env:
          NFI_MAX_RELEASES: ${{ inputs.max_releases || '0' }}
          NFI_WORK: ${{ runner.temp }}/nfi-work
          CHANNEL: ${{ matrix.channel }}
        run: |
          chmod +x bin/nfi-indexer
          ci/index-channel.sh "$CHANNEL"
