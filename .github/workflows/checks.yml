name: Checks

# Runs the dev shell's git hooks (see `preCommit` in flake.nix) on every file:
# nix/Cargo.nix must match Cargo.lock, and Nix and Rust code must be formatted.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - name: Run the git hooks on all files
        run: nix develop --command pre-commit run --all-files --show-diff-on-failure
