[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/techninja1008/nix-fetch-indexer"
readme = "README.md"

[workspace.dependencies]
nfi-interchange = { path = "crates/nfi-interchange" }
nfi-api = { path = "crates/nfi-api" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
zstd = { version = "0.13", features = ["zstdmt"] }
xz2 = "0.1"
brotli = "8"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query", "stream", "gzip"] }
futures = "0.3"
tempfile = "3"
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
shell-words = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
