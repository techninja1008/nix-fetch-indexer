[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/techninja1008/nix-fetch-indexer"

[workspace.dependencies]
nfi-interchange = { path = "crates/nfi-interchange" }
nfi-api = { path = "crates/nfi-api" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
zstd = { version = "0.13", features = ["zstdmt"] }
xz2 = "0.1"
brotli = "8"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "stream", "gzip"] }
futures = "0.3"
tempfile = "3"
